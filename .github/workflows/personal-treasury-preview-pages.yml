name: Personal Treasury Preview

on:
  push:
    branches:
      - personal-treasury-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: personal-treasury-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: personal-treasury-preview
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
