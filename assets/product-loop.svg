<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" rx="28" fill="#0d1117"/>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc}
    .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8b949e}
    .a{fill:#161b22;stroke:#30363d;stroke-width:2}
    .n{font-size:18px;font-weight:700;fill:#7ee787}
    .h{font-size:24px;font-weight:700}
    .p{font-size:17px}
    .arrow{stroke:#8b949e;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <text x="54" y="58" class="t h">How I turn uncertainty into a product decision</text>
  <rect x="54" y="98" width="238" height="184" rx="20" class="a"/>
  <text x="78" y="130" class="t n">01</text><text x="78" y="169" class="t h">Find the real problem</text>
  <text x="78" y="204" class="s p">What is failing today?</text><text x="78" y="232" class="s p">For whom? What matters?</text>
  <path d="M305 190h54m-16-14 16 14-16 14" class="arrow"/>
  <rect x="372" y="98" width="238" height="184" rx="20" class="a"/>
  <text x="396" y="130" class="t n">02</text><text x="396" y="169" class="t h">Make choices explicit</text>
  <text x="396" y="204" class="s p">Rules, trade-offs, ownership</text><text x="396" y="232" class="s p">and human / AI boundaries.</text>
  <path d="M623 190h54m-16-14 16 14-16 14" class="arrow"/>
  <rect x="690" y="98" width="218" height="184" rx="20" class="a"/>
  <text x="714" y="130" class="t n">03</text><text x="714" y="169" class="t h">Build the smallest test</text>
  <text x="714" y="204" class="s p">A working flow, not a deck.</text><text x="714" y="232" class="s p">Enough to expose bad logic.</text>
  <path d="M921 190h54m-16-14 16 14-16 14" class="arrow"/>
  <rect x="988" y="98" width="158" height="184" rx="20" class="a"/>
  <text x="1012" y="130" class="t n">04</text><text x="1012" y="169" class="t h">Get evidence</text>
  <text x="1012" y="204" class="s p">Test it.</text><text x="1012" y="232" class="s p">Learn.</text><text x="1012" y="260" class="s p">Scale or kill.</text>
</svg>